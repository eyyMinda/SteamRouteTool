name: Release

# Push a tag matching the project version to publish a release, e.g.:
#   git tag v1.0.7 && git push origin v1.0.7
# Works from main and from maintenance branches (release/1.x): the tag's commit is built.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check tag matches project version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content SteamRouteTool/SteamRouteTool.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG doesn't match the project version $version." }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test -c Release

      - name: Publish self-contained exe
        run: >-
          dotnet publish SteamRouteTool/SteamRouteTool.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish

      - name: Package and write release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory release | Out-Null
          $exe = "SteamRouteTool-$env:VERSION-win-x64.exe"
          Copy-Item publish/SteamRouteTool.exe "release/$exe"
          $hash = (Get-FileHash "release/$exe" -Algorithm SHA256).Hash.ToLower()
          Set-Content release/SHA256SUMS.txt "$hash  $exe" -Encoding ascii

          # Release notes: every CHANGELOG.md section newer than the previous release, so versions that were never
          # released on their own (e.g. 2.0.0-2.0.4 before 2.0.5) are included. On release/* branches this is just the fix.
          $current = [version]$env:VERSION
          $previous = gh release list --limit 100 --json tagName --jq '.[].tagName' |
            Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | ForEach-Object { [version]$_.Substring(1) } |
            Where-Object { $_ -lt $current } | Sort-Object -Descending | Select-Object -First 1
          $sections = New-Object System.Collections.Generic.List[string]
          $include = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^## \[(\d+\.\d+\.\d+)\]') {
              $version = [version]$Matches[1]
              $include = $version -le $current -and ($null -eq $previous -or $version -gt $previous)
            }
            if ($include) { $sections.Add($line) }
          }
          if (-not ($sections | Where-Object { $_ -like "## ``[$env:VERSION``]*" })) { throw "CHANGELOG.md has no section for $env:VERSION." }
          $notes = @($sections) + @(
            "",
            "---",
            "**Download:** ``$exe`` is self-contained: no .NET install needed. Windows may show a SmartScreen warning for this unsigned exe; choose **More info**, then **Run anyway**. Verify the download against ``SHA256SUMS.txt``."
          )
          Set-Content notes.md $notes -Encoding utf8

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the highest version becomes "Latest", so a fix released from a release/* branch (e.g. 1.1.1 after 2.0.0)
          # doesn't replace the newest major version as the main download.
          $released = gh release list --limit 100 --json tagName --jq '.[].tagName' |
            Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | ForEach-Object { [version]$_.Substring(1) }
          $isLatest = -not ($released | Where-Object { $_ -gt [version]$env:VERSION })
          gh release create $env:TAG release/* --title "SteamRouteTool $env:VERSION" --notes-file notes.md "--latest=$($isLatest.ToString().ToLower())"
